<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://fontawesome.com" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="index.css">

        <title>Portal Educacional SENAI | Login</title>

    </head>
    <body>
        <!-- Imagens de fundo: 50% esquerda e 50% direita-->
        <div class="fundo fundo-esquerda "></div>
        <div class="fundo fundo-direita"></div>

        <!-- Painel central de login (inputs/campos) -->
        <main class="login">
            <h1>BEM-VINDO AO</h1>
            <img class="logo" src="./img/logo-portal-senai-1.png"
                alt="Logo do Portal Educacional SENAI">
            <h2>FAÇA SEU LOGIN E CONHEÇA AS NOVIDADES</h2>
            <form>
                <div class="cpf">
                    <input id="Login" type="text"
                        placeholder="___.___.___-__ ">
                </div>
                <div class="senha">
                    <input id="Senha" type="password"
                        placeholder="• • • • • • • • • • ">
                </div>
                <div class="btnentrar">
                    <button type="submit">Entrar</button>
                </div>

            </form>
            <div>
                <p class="links">Não tenho acesso. <a href="#">O que fazer?</a></p>
                <p><a href="#">Esqueci minha senha</a></p>
            </div>
        </main>
    </body>
    
</html>
